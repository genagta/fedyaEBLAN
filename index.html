<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Рофл сайт 2.0</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Arial', sans-serif; overflow: hidden;
            touch-action: manipulation;
        }

        /* --- ФОНЫ --- */
        body.bg-rainbow {
            background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            background-size: 400% 400%;
            animation: rainbow-animation 10s ease infinite;
        }

        body.bg-fedya {
            background-image: url('IMG_6374.jpeg'); 
            background-size: contain; 
            background-position: center top; 
            background-repeat: no-repeat;
            background-color: rgb(0, 255, 0); 
        }

        @keyframes rainbow-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- ИНТЕРФЕЙС --- */
        #main-text {
            text-align: center; color: white;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
            transition: opacity 0.5s ease;
            user-select: none; pointer-events: none;
        }

        #menu, #rules-screen, #settings-panel, #sparrow-screen, #secret-screen { 
            display: none; flex-direction: column; gap: 15px; z-index: 10; align-items: center; text-align: center; color: white; padding: 20px; 
        }

        .btn {
            padding: 15px 30px; font-size: 1.1rem; border: none;
            border-radius: 50px; cursor: pointer; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); background: white;
            text-align: center; color: black;
            text-decoration: none; width: 250px;
        }

        .btn-white { background-color: #ffffff !important; color: black !important; }

        #game-wrapper { display: none; text-align: center; }
        canvas { background: #000; border: 3px solid white; max-width: 90vw; max-height: 40vh; }

        .controls { display: grid; grid-template-columns: repeat(3, 60px); grid-gap: 10px; justify-content: center; margin-top: 15px; }
        .ctrl-btn { width: 60px; height: 60px; background: rgba(255,255,255,0.3); border: 2px solid white; border-radius: 10px; color: white; font-weight: bold; font-size: 20px; display: flex; align-items: center; justify-content: center; }

        /* Счетчик комбо */
        #combo-counter {
            font-size: 3rem;
            font-weight: bold;
            color: #ffff00;
            text-shadow: 2px 2px 5px black;
            margin-bottom: 10px;
            transition: transform 0.1s;
        }

        #sparrow-img { width: 300px; max-width: 80vw; transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); user-select: none; }
        .flipped { transform: rotate(180deg); }

        /* Секретный экран */
        #secret-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; z-index: 1000; justify-content: center;
        }
        #secret-screen img { width: 100%; height: 100%; object-fit: contain; }

        #win-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: gold; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; }
        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body id="bg-body" class="bg-rainbow" onclick="handleGlobalClick()">

    <div id="main-text">
        <h1>Добро пожаловать на рофл сайт</h1>
        <p>(федя нищий кстати)</p>
        <p style="font-size: 0.8rem; opacity: 0.7;">Нажми куда угодно</p>
    </div>

    <div id="menu">
        <button class="btn" onclick="rickroll(event)">мой тг</button> 
        <button class="btn" onclick="checkRules(event)">играть в змейку</button>
        <button class="btn btn-white" onclick="showSparrow(event)">переворачивать спарроу</button>
        <button class="btn" style="background-color: #f0f0f0; color: #333;" onclick="showSettings(event)">настройки</button> 
    </div>

    <div id="sparrow-screen" onclick="flipSparrow(event)">
        <div id="combo-counter">0</div>
        <img id="sparrow-img" src="IMG_6410.jpeg" alt="Красный Sparrow">
        <p>Красный Sparrow — легенда приземлений</p>
        <button class="btn" onclick="backToMenu(event)" style="background: red; color: white;">Назад в меню</button>
    </div>

    <div id="secret-screen">
        <img src="IMG_6174.jpeg" alt="Секретка">
        <audio id="secret-audio" loop>
            <source src="1556139147221580238.mov" type="video/mp4">
        </audio>
        <button class="btn" onclick="closeSecret(event)" style="position: absolute; bottom: 20px; opacity: 0.6;">Выйти из чилла</button>
    </div>

    <div id="rules-screen">
        <h2>Собери 3 яблока для победы.</h2>
        <button class="btn" onclick="startGame(event)">Играть!</button>
    </div>

    <div id="game-wrapper">
        <div style="color: white; margin-bottom: 5px;">Счет: <span id="score">0</span> / 3</div>
        <canvas id="snakeGame" width="400" height="400"></canvas>
        <div class="controls">
            <div></div><div class="ctrl-btn" onclick="setDir('UP')">▲</div><div></div>
            <div class="ctrl-btn" onclick="setDir('LEFT')">◀</div><div class="ctrl-btn" onclick="setDir('DOWN')">▼</div><div class="ctrl-btn" onclick="setDir('RIGHT')">▶</div>
        </div>
    </div>

    <div id="win-screen">
        <h1>ФЕДЯ НИЩИЙ УРА!</h1>
        <button class="btn" onclick="resetToMenu(event)">в меню</button>
    </div>

    <div id="settings-panel">
        <h2>Настройки фона</h2>
        <button class="btn btn-style" style="background: white;" onclick="setBg('rainbow', event)">Радужный</button>
        <button class="btn btn-style" style="background: #333; color: white;" onclick="setBg('fedya', event)">Федя</button>
        <button class="btn" onclick="hideSettings(event)" style="margin-top: 20px; background: red; color: white;">Назад</button>
    </div>

    <script>
        let stage = 1;
        let gameLoop, d, rulesSeen = false, sparrowFlipped = false;

        // Переменные комбо
        let combo = [];
        let lastClickTime = 0;
        let clickCountInSeries = 0;
        let comboTimer;

        function handleGlobalClick() {
            if (stage === 1) {
                stage = 2;
                document.getElementById('main-text').classList.add('hidden');
                setTimeout(() => {
                    document.getElementById('main-text').style.display = 'none';
                    document.getElementById('menu').style.display = 'flex';
                }, 500);
            }
        }

        function rickroll(e) {
            if (e) e.stopPropagation();
            window.location.href = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
        }

        function showSparrow(e) {
            e.stopPropagation();
            document.getElementById('menu').style.display = 'none';
            document.getElementById('sparrow-screen').style.display = 'flex';
            resetComboState();
        }

        function flipSparrow(e) {
            e.stopPropagation();
            if (e.target.tagName === 'BUTTON') return; 

            sparrowFlipped = !sparrowFlipped;
            const img = document.getElementById('sparrow-img');
            const counterDisp = document.getElementById('combo-counter');
            img.classList.toggle('flipped');

            const now = Date.now();
            
            // Логика серий кликов
            if (now - lastClickTime > 1500 && lastClickTime !== 0) {
                combo.push(clickCountInSeries);
                clickCountInSeries = 1;
                checkCombo();
            } else {
                clickCountInSeries++;
            }
            
            counterDisp.innerText = clickCountInSeries;
            lastClickTime = now;

            clearTimeout(comboTimer);
            comboTimer = setTimeout(() => {
                combo.push(clickCountInSeries);
                counterDisp.style.color = "#00ff00"; 
                setTimeout(() => {
                    counterDisp.innerText = "0";
                    counterDisp.style.color = "#ffff00";
                }, 300);

                checkCombo();
                clickCountInSeries = 0;
                if (combo.length >= 4) combo = []; 
            }, 2000);
        }

        function checkCombo() {
            const secret = [1, 4, 8, 8];
            let lastFour = combo.slice(-4);
            if (lastFour.join(',') === secret.join(',')) {
                document.getElementById('sparrow-screen').style.display = 'none';
                document.getElementById('secret-screen').style.display = 'flex';
                document.getElementById('secret-audio').play();
                combo = []; 
            }
        }

        function closeSecret(e) {
            e.stopPropagation();
            document.getElementById('secret-audio').pause();
            document.getElementById('secret-screen').style.display = 'none';
            document.getElementById('menu').style.display = 'flex';
        }

        function backToMenu(e) {
            e.stopPropagation();
            document.getElementById('sparrow-screen').style.display = 'none';
            document.getElementById('menu').style.display = 'flex';
        }

        function resetComboState() {
            combo = [];
            clickCountInSeries = 0;
            document.getElementById('combo-counter').innerText = "0";
        }

        /* --- ОСТАЛЬНЫЕ ФУНКЦИИ (Настройки, Змейка) --- */

        function showSettings(e) {
            e.stopPropagation();
            document.getElementById('menu').style.display = 'none';
            document.getElementById('settings-panel').style.display = 'flex';
        }

        function hideSettings(e) {
            e.stopPropagation();
            document.getElementById('settings-panel').style.display = 'none';
            document.getElementById('menu').style.display = 'flex';
        }

        function setBg(bgType, e) {
            if(e) e.stopPropagation();
            const body = document.getElementById('bg-body');
            body.classList.remove('bg-rainbow', 'bg-fedya');
            if (bgType === 'fedya') body.classList.add('bg-fedya');
            else body.classList.add('bg-rainbow');
        }

        function checkRules(e) {
            e.stopPropagation();
            document.getElementById('menu').style.display = 'none';
            if (rulesSeen) {
                document.getElementById('game-wrapper').style.display = 'block';
                initSnake();
            } else {
                document.getElementById('rules-screen').style.display = 'flex';
                rulesSeen = true;
            }
        }

        function startGame(e) {
            e.stopPropagation();
            document.getElementById('rules-screen').style.display = 'none';
            document.getElementById('game-wrapper').style.display = 'block';
            initSnake();
        }

        function resetToMenu(e) {
            if(e) e.stopPropagation();
            document.getElementById('win-screen').style.display = 'none';
            document.getElementById('game-wrapper').style.display = 'none';
            document.getElementById('menu').style.display = 'flex';
            stage = 2; 
        }

        function setDir(dir) { 
            if(dir == 'LEFT' && d != 'RIGHT') d = 'LEFT';
            if(dir == 'UP' && d != 'DOWN') d = 'UP';
            if(dir == 'RIGHT' && d != 'LEFT') d = 'RIGHT';
            if(dir == 'DOWN' && d != 'UP') d = 'DOWN';
        }

        function initSnake() {
            const canvas = document.getElementById("snakeGame");
            const ctx = canvas.getContext("2d");
            const scoreEl = document.getElementById("score");
            let score = 0;
            scoreEl.innerText = score;
            d = undefined; 
            let box = 20;
            let snake = [{x: 9 * box, y: 10 * box}];
            let food = { x: Math.floor(Math.random()*19+1)*box, y: Math.floor(Math.random()*19+1)*box };
            if(gameLoop) clearInterval(gameLoop);

            function draw() {
                ctx.fillStyle = "black";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                for(let i=0; i<snake.length; i++) {
                    ctx.fillStyle = (i==0) ? "#00FF00" : "#008000";
                    ctx.fillRect(snake[i].x, snake[i].y, box, box);
                }
                ctx.fillStyle = "red";
                ctx.fillRect(food.x, food.y, box, box);
                let sX = snake[0].x;
                let sY = snake[0].y;
                if(d == "LEFT") sX -= box;
                if(d == "UP") sY -= box;
                if(d == "RIGHT") sX += box;
                if(d == "DOWN") sY += box;
                if(sX == food.x && sY == food.y) {
                    score++;
                    scoreEl.innerText = score;
                    if(score >= 3) {
                        clearInterval(gameLoop);
                        document.getElementById('game-wrapper').style.display = 'none';
                        document.getElementById('win-screen').style.display = 'flex';
                        return;
                    }
                    food = { x: Math.floor(Math.random()*19+1)*box, y: Math.floor(Math.random()*19+1)*box };
                } else { snake.pop(); }
                let newHead = {x: sX, y: sY};
                if(sX < 0 || sX >= canvas.width || sY < 0 || sY >= canvas.height || snake.some(s => s.x === newHead.x && s.y === newHead.y)) {
                    clearInterval(gameLoop);
                    alert("Проиграл!");
                    resetToMenu();
                }
                snake.unshift(newHead);
            }
            gameLoop = setInterval(draw, 150);
        }
    </script>
</body>
</html>
